  tags:
    - Users
  summary: Listar informações do atual usuário
  description: Listar informações do atual usuário
  security:
    - Bearer token: []

  responses:
    '200':
      description: Usuário atual
      content:
        application/json:
          schema:
            type: object
            properties:
              user:
                type: object
                properties:
                  id:
                    type: string
                    example: 'user_id'
                  username:
                    type: string
                    example: 'user_name'

          example:
            user:
              id: user_id
              username: user_name

    '401':
      description: Você não possui um token válido
    '404':
      description: Você não possui informações desse usuário para listagem
    '500':
      description: Erro interno do servidor
